#!/usr/bin/env bash
# Scenario: Priority tier differentiation
# Three streams targeting realtime / standard / low-priority tiers.

SCENARIO_NAME="02-priority-tiers"
SCENARIO_DURATION=120

STREAM_COUNT=3

# --- Stream 1: Realtime (priority 100) ------------------------------------
STREAM_1_NAME="realtime"
STREAM_1_HEADERS=("-H" "x-llm-d-inference-objective:realtime")
STREAM_1_CONCURRENCY=10
STREAM_1_DATA="prompt_tokens=128,output_tokens=64"
STREAM_1_STREAMING="true"

# --- Stream 2: Standard (priority 0) --------------------------------------
STREAM_2_NAME="standard"
STREAM_2_HEADERS=("-H" "x-llm-d-inference-objective:standard")
STREAM_2_CONCURRENCY=20
STREAM_2_DATA="prompt_tokens=512,output_tokens=256"
STREAM_2_STREAMING="true"

# --- Stream 3: Low-priority (priority -1) -------------------------------
STREAM_3_NAME="low-priority"
STREAM_3_HEADERS=("-H" "x-llm-d-inference-objective:low-priority")
STREAM_3_CONCURRENCY=20
STREAM_3_DATA="prompt_tokens=1024,output_tokens=512"
STREAM_3_STREAMING="true"
