#!/usr/bin/env bash
# Scenario: Intra-tier fairness among tenants
# Three streams at standard priority with different fairness IDs and load levels.

SCENARIO_NAME="03-intra-tier-fairness"
SCENARIO_DURATION=120

STREAM_COUNT=3

# --- Stream 1: Tenant A (heavy sender) ------------------------------------
STREAM_1_NAME="tenant-a"
STREAM_1_HEADERS=("-H" "x-llm-d-inference-objective:standard" "-H" "x-llm-d-fairness-id:tenant-a")
STREAM_1_CONCURRENCY=30
STREAM_1_DATA="prompt_tokens=512,output_tokens=256"
STREAM_1_STREAMING="true"

# --- Stream 2: Tenant B (medium sender) ------------------------------------
STREAM_2_NAME="tenant-b"
STREAM_2_HEADERS=("-H" "x-llm-d-inference-objective:standard" "-H" "x-llm-d-fairness-id:tenant-b")
STREAM_2_CONCURRENCY=15
STREAM_2_DATA="prompt_tokens=512,output_tokens=256"
STREAM_2_STREAMING="true"

# --- Stream 3: Tenant C (light sender) ------------------------------------
STREAM_3_NAME="tenant-c"
STREAM_3_HEADERS=("-H" "x-llm-d-inference-objective:standard" "-H" "x-llm-d-fairness-id:tenant-c")
STREAM_3_CONCURRENCY=5
STREAM_3_DATA="prompt_tokens=512,output_tokens=256"
STREAM_3_STREAMING="true"
