#!/usr/bin/env bash
# Scenario: Batch vs. interactive traffic
# Single interactive stream at standard priority.
# The batch job is launched separately by run.sh via submit-batch-job.sh.

SCENARIO_NAME="04-batch-vs-interactive"
SCENARIO_DURATION=120

STREAM_COUNT=1

# --- Stream 1: Interactive (standard priority) ------------------------------
STREAM_1_NAME="interactive-standard"
STREAM_1_HEADERS=("-H" "x-llm-d-inference-objective:standard")
STREAM_1_CONCURRENCY=15
STREAM_1_DATA="prompt_tokens=512,output_tokens=256"
STREAM_1_STREAMING="true"
