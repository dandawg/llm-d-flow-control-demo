apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: llm-d-flow-control
  region: us-east-2
  version: "1.31"
managedNodeGroups:
  - name: system
    instanceType: m5.xlarge
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    labels:
      role: system
  - name: gpu-a10
    instanceType: g5.xlarge
    desiredCapacity: 2
    minSize: 0
    maxSize: 2
    labels:
      role: gpu
      nvidia.com/gpu.product: A10G
    taints:
      - key: nvidia.com/gpu
        value: "true"
        effect: NoSchedule
    volumeSize: 200
