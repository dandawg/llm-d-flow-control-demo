# =============================================================================
# MinIO — S3-compatible object storage for batch input/output files
# =============================================================================
# Single-replica, emptyDir-backed deployment suitable for PoC / demo only.
# Data is ephemeral — restarting the pod wipes all stored files.
# ** NOT FOR PRODUCTION ** — use a managed S3 service or persistent volumes.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: batch-api
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args: ["server", "/data", "--console-address", ":9001"]
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        env:
        - name: MINIO_ROOT_USER
          value: minioadmin        # PoC-only — do NOT use in production
        - name: MINIO_ROOT_PASSWORD
          value: minioadmin        # PoC-only — do NOT use in production
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: batch-api
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
