# =============================================================================
# PostgreSQL — metadata store for the batch gateway
# =============================================================================
# Single-replica Deployment with ephemeral storage (emptyDir).
# ** NOT FOR PRODUCTION ** — use a managed database or operator with proper
# secret management, backups, and TLS.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: batch-api
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: batch
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: poc-password      # PoC-only — do NOT use in production
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pgdata
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: batch-api
  labels:
    app: postgresql
spec:
  selector:
    app: postgresql
  ports:
  - port: 5432
    targetPort: 5432
